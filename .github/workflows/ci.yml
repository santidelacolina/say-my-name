# Verificación en pull requests: typecheck + build.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
